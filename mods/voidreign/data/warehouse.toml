# Native OpenSE4 storage abilities enforce these caps in the core economy.
# Each warehouse adds 5,000 units to each empire-wide resource storage limit.
[[facilities.add]]
name = "VoidReign Warehouse"

[facilities.add.set]
"Description" = "A bonded planetary warehouse. Adds 5,000 units of capacity to minerals, organics and radioactives."
"Facility Group" = "Logistics"
"Pic Num" = 1
"Facility Family" = 7402
"Roman Numeral" = 1
"Restrictions" = "None"
"Cost Minerals" = 250
"Cost Organics" = 100
"Cost Radioactives" = 0
"Number of Tech Req" = 0
"Number of Abilities" = 3

[facilities.add.add]
abilities = [
  { "Ability Type" = "Resource Storage - Mineral", "Ability Descr" = "Adds 5,000 mineral storage.", "Ability Val 1" = 5000 },
  { "Ability Type" = "Resource Storage - Organics", "Ability Descr" = "Adds 5,000 organic storage.", "Ability Val 1" = 5000 },
  { "Ability Type" = "Resource Storage - Radioactives", "Ability Descr" = "Adds 5,000 radioactive storage.", "Ability Val 1" = 5000 },
]
